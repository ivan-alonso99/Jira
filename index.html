<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header>
        <div class="board">
            <h1>Tablero</h1>
        </div>
        <div class="button-create">
            <button class="button" onclick="openModal()">Agregar</button>
            <div class="content-modal"> 
                <dialog id = "modal">
                <form action="script.js">
                    <label for="title">Titulo de la Tarea</label>
                    <input id="title-task" type="text" placeholder="Ingresa Tarea">
                    <textarea name="description" placeholder="Descripcion" id="description"></textarea>
                   <div>
                     <button class="button" onclick="agregarTarea(event), closeModal(event)">Crear</button>
                   </div>
                </form>
            </dialog></div>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-plus-circle-fill" viewBox="0 0 16 16">
                <path
                    d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v3h-3a.5.5 0 0 0 0 1h3v3a.5.5 0 0 0 1 0v-3h3a.5.5 0 0 0 0-1h-3z" />
            </svg>
        </div>
    </header>
    <main> 
        <div class="content" id="to-do-list"><h2>Por Hacer</h2></div>
        <div class="content" id="in-progress"><h2>En Progreso</h2></div>
        <div class="content" id="code-review"><h2>En Revision</h2></div>
        <div class="content" id="done"><h2>HECHO</h2></div>
    </main>
    <footer>

    </footer>
    <script src="script.js"></script>
</body>

</html>
